name: Run Unit Tests

# Controls when the workflow will run
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests and build
        run: mvn -B clean verify